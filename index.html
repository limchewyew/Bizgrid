<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bizgrid</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1a1d26;
      --card-border: #2a2e3d;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      background: rgba(15, 17, 23, 0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-grow: 1;
      max-width: 600px;
    }

    .search-bar {
      flex: 1;
      padding: 0.6rem 1rem;
      background: #232733;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar:focus {
      border-color: var(--accent);
    }

    .view-toggle {
      background: #232733;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.3rem;
      display: flex;
      gap: 0.25rem;
    }

    .toggle-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .toggle-btn.active {
      background: var(--accent);
      color: #fff;
    }

    main {
      flex: 1;
      position: relative;
    }

    #loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem 1rem;
      color: var(--text-muted);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--card-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #grid-view {
      padding: 1.5rem 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #3b4254;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .logo-img {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      object-fit: contain;
      background: #fff;
      padding: 3px;
    }

    .logo-placeholder {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: #2a2e3d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--text-muted);
    }

    .company-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .company-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }

    .tag {
      background: #262a36;
      border: 1px solid #323746;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      color: #cbd5e1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid var(--card-border);
      font-size: 0.8rem;
    }

    .website-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .website-link:hover {
      text-decoration: underline;
    }

    #map-view {
      display: none;
      width: 100%;
      height: calc(100vh - 75px);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">Bizgrid</div>
    <div class="controls">
      <input type="text" id="search-input" class="search-bar" placeholder="Search companies, countries, industries..." />
      <div class="view-toggle">
        <button id="grid-toggle-btn" class="toggle-btn active" onclick="switchView('grid')">Grid</button>
        <button id="map-toggle-btn" class="toggle-btn" onclick="switchView('map')">Map</button>
      </div>
    </div>
  </header>

  <main>
    <div id="loading-state">
      <div class="spinner"></div>
      <p>Loading records from Google Sheets...</p>
    </div>

    <div id="grid-view"></div>
    <div id="map-view"></div>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Live Google Sheet URL (GID: 1224566365)
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1R8aekz9Tx803PiGKX9AjB_z8qUD19_JU/gviz/tq?tqx=out:json&gid=1224566365';

    let allCompanies = [];
    let mapInstance = null;
    let markersLayer = null;

      try {

        const text = await response.text();

        // Extract JSON from Google's callback wrapper
        const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const data = JSON.parse(jsonString);

        // Map column headers
        const headers = data.table.cols.map(c => (c.label ? c.label.trim() : ''));

        const records = data.table.rows.map(row => {
          const item = {};
          row.c.forEach((cell, idx) => {
            const header = headers[idx];
            if (header) {
              item[header] = cell ? cell.v : '';
            }
          });

          if (item['Coordinates'] && typeof item['Coordinates'] === 'string') {
