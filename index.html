<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bizgrid Directory</title>

  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d26;
      --border: #2a2e3d;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --row-hover: #222634;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 0.85rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 17, 23, 0.95);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex: 1;
      max-width: 500px;
    }

    .search-bar {
      flex: 1;
      padding: 0.55rem 0.9rem;
      background: #232733;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar:focus {
      border-color: var(--accent);
    }

    .record-count {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    main {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 0.75rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .table-container {
      flex: 1;
      overflow: auto;
      display: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    thead {
      position: sticky;
      top: 0;
      background: #161922;
      z-index: 10;
      box-shadow: 0 1px 0 var(--border);
    }

    th {
      padding: 0.75rem 1rem;
      font-weight: 600;
      color: #d1d5db;
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.5px;
    }

    td {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid #1f2330;
      color: #e5e7eb;
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    tbody tr:hover {
      background-color: var(--row-hover);
    }

    .logo-cell {
      width: 44px;
      text-align: center;
      padding: 0.4rem 0.5rem;
    }

    .table-logo {
      width: 26px;
      height: 26px;
      object-fit: contain;
      background: #fff;
      border-radius: 4px;
      padding: 2px;
      display: inline-block;
      vertical-align: middle;
    }

    .logo-fallback {
      width: 26px;
      height: 26px;
      line-height: 26px;
      text-align: center;
      background: #2a2e3d;
      border-radius: 4px;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.75rem;
      display: inline-block;
      vertical-align: middle;
    }

    .desc-cell {
      max-width: 280px;
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.35;
      color: var(--text-muted);
    }

    a.cell-link {
      color: var(--accent);
      text-decoration: none;
    }

    a.cell-link:hover {
      text-decoration: underline;
    }

    .pill {
      display: inline-block;
      background: #232733;
      border: 1px solid #333849;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">Bizgrid</div>
    <div class="controls">
      <input type="text" id="search-input" class="search-bar" placeholder="Filter by company, industry, country, or sector..." />
      <span class="record-count" id="record-count">0 records</span>
    </div>
  </header>

  <main>
    <div id="loading-state">
      <div class="spinner"></div>
      <p>Loading records from Dataset...</p>
    </div>

    <div class="table-container" id="table-container">
      <table>
        <thead>
          <tr>
            <th>Logo</th>
            <th>Company Name</th>
            <th>Country</th>
            <th>Description</th>
            <th>Website</th>
            <th>Employees</th>
            <th>Founded</th>
            <th>Revenue</th>
            <th>Coordinates</th>
            <th>Activity</th>
            <th>Sub-industry</th>
            <th>Industry</th>
            <th>Sector</th>
            <th>Region</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </main>

  <script>
    // Explicitly targeting the "Dataset" sheet tab via GID and sheet name
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1R8aekz9Tx803PiGKX9AjB_z8qUD19_JU/gviz/tq?tqx=out:json&sheet=Dataset&gid=1224566365';

    let allCompanies = [];

    async function fetchDataset() {
      try {
        const response = await fetch(SHEET_URL);
        const text = await response.text();

        // Extract JSON string from the Google Visualization response wrapper
        const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const json = JSON.parse(jsonString);

        // Normalize header names to match the first row
        const headers = json.table.cols.map(c => (c.label ? c.label.trim() : ''));

        return json.table.rows.map(row => {
          const entry = {};
          row.c.forEach((cell, idx) => {
            const key = headers[idx];
            if (key) {
              entry[key] = (cell && cell.v !== null && cell.v !== undefined) ? cell.v : '';
            }
          });
          return entry;
        });
      } catch (err) {
        console.error('Failed to load Google Sheet data:', err);
        return [];
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('table-body');
      const countLabel = document.getElementById('record-count');
      tbody.innerHTML = '';
      countLabel.textContent = `${data.length.toLocaleString()} records`;

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="14" style="text-align: center; padding: 3rem; color: var(--text-muted);">No matching records found.</td></tr>`;
        return;
      }

      const fragment = document.createDocumentFragment();

      data.forEach(item => {
        const tr = document.createElement('tr');

        const logo = item['Logo'] || '';
        const name = item['Company Name'] || '-';
        const country = item['Country'] || '-';
        const desc = item['Description'] || '-';
        const website = item['Website'] || '';
        const employees = item['Number of employees'] || '-';
        const founded = item['Founded year'] || '-';
        const revenue = item['Revenue range'] || '-';
        const coords = item['Coordinates'] || '-';
        const activity = item['Activity'] || '-';
        const subIndustry = item['Sub-industry'] || '-';
        const industry = item['Industry'] || '-';
        const sector = item['Sector'] || '-';
        const region = item['Region'] || '-';

        // Logo cell renderer
        const logoHtml = logo
          ? `<img src="${logo}" class="table-logo" alt="${name}" onerror="this.onerror=null; this.outerHTML='<span class=\\'logo-fallback\\'>${name[0] || 'C'}</span>'" />`
          : `<span class="logo-fallback">${name[0] || 'C'}</span>`;

        // Website link renderer
        const websiteHtml = website
          ? `<a href="${website.startsWith('http') ? website : 'https://' + website}" target="_blank" rel="noopener noreferrer" class="cell-link">${website}</a>`
          : '-';

        tr.innerHTML = `
          <td class="logo-cell">${logoHtml}</td>
          <td><strong>${name}</strong></td>
          <td>${country !== '-' ? `<span class="pill">${country}</span>` : '-'}</td>
          <td><div class="desc-cell" title="${desc}">${desc}</div></td>
          <td>${websiteHtml}</td>
          <td>${employees}</td>
          <td>${founded}</td>
          <td>${revenue}</td>
          <td style="color: var(--text-muted);">${coords}</td>
          <td>${activity}</td>
          <td>${subIndustry}</td>
          <td>${industry}</td>
          <td>${sector}</td>
          <td>${region}</td>
        `;

        fragment.appendChild(tr);
      });

      tbody.appendChild(fragment);
    }

    function applySearch() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      if (!query) {
        renderTable(allCompanies);
        return;
      }

      const filtered = allCompanies.filter(item => {
        return (
          (item['Company Name'] || '').toString().toLowerCase().includes(query) ||
          (item['Country'] || '').toString().toLowerCase().includes(query) ||
          (item['Description'] || '').toString().toLowerCase().includes(query) ||
          (item['Industry'] || '').toString().toLowerCase().includes(query) ||
          (item['Sector'] || '').toString().toLowerCase().includes(query) ||
          (item['Sub-industry'] || '').toString().toLowerCase().includes(query) ||
          (item['Activity'] || '').toString().toLowerCase().includes(query) ||
          (item['Region'] || '').toString().toLowerCase().includes(query)
        );
      });

      renderTable(filtered);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('search-input').addEventListener('input', applySearch);

      allCompanies = await fetchDataset();

      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('table-container').style.display = 'block';

      renderTable(allCompanies);
    });
  </script>
</body>
</html>
