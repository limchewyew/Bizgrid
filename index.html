<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bizgrid Directory</title>

  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d26;
      --border: #2a2e3d;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --row-hover: #222634;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 0.85rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 17, 23, 0.95);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }

    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex: 1;
      max-width: 500px;
    }

    .search-bar {
      flex: 1;
      padding: 0.55rem 0.9rem;
      background: #232733;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar:focus {
      border-color: var(--accent);
    }

    .record-count {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    main {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 0.75rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .table-container {
      flex: 1;
      overflow: auto;
      display: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

      thead {
        z-index: 10;
    }

      th {
        position: sticky;
        top: 0;
        background: #161922;
        box-shadow: 0 1px 0 var(--border);
        z-index: 10;
        padding: 0.75rem 0.85rem;
        font-weight: 600;
        color: #d1d5db;
        border-bottom: 1px solid var(--border);
        text-transform: uppercase;
        font-size: 0.72rem;
        letter-spacing: 0.5px;
        white-space: nowrap;
        text-align: center;
        user-select: none;
    }
    
    /* Sortable Header Styling */
    th.sortable {
      cursor: pointer;
      transition: color 0.15s, background-color 0.15s;
    }

    th.sortable:hover {
      background-color: #232733;
      color: var(--accent);
    }

    th.sort-active {
      color: var(--accent);
    }

    .sort-icon {
      margin-left: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    th.sort-active .sort-icon {
      color: var(--accent);
    }

    td {
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid #1f2330;
      color: #e5e7eb;
      vertical-align: middle;
      text-align: center;
    }

    tbody tr:hover {
      background-color: var(--row-hover);
    }

    /* Column Widths & Alignments */
    .col-logo {
      width: 50px;
      padding: 0.4rem 0.5rem;
    }

    .col-name {
      width: max-content;
      white-space: nowrap;
    }

    .col-country {
      width: 120px;
      white-space: nowrap;
    }

    /* Description centered header, left-aligned body text */
    th.col-desc {
      text-align: center;
    }

    td.col-desc {
      text-align: left;
    }

    .col-desc {
      min-width: 320px;
      max-width: 480px;
      white-space: normal;
      line-height: 1.4;
      color: #cbd5e1;
      word-break: break-word;
    }

    /* Centered website icon with separation */
    .col-web {
      width: 80px;
      min-width: 80px;
      padding-right: 1.5rem;
      white-space: nowrap;
    }

    .col-emp {
      width: 120px;
      white-space: nowrap;
      padding-left: 0.75rem;
    }

    .col-year {
      width: 90px;
      white-space: nowrap;
    }

    .col-rev {
      width: 130px;
      white-space: nowrap;
    }

    .col-misc {
      white-space: nowrap;
    }

    .table-logo {
      width: 26px;
      height: 26px;
      object-fit: contain;
      background: #fff;
      border-radius: 4px;
      padding: 2px;
      display: inline-block;
      vertical-align: middle;
    }

    .logo-fallback {
      width: 26px;
      height: 26px;
      line-height: 26px;
      text-align: center;
      background: #2a2e3d;
      border-radius: 4px;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.75rem;
      display: inline-block;
      vertical-align: middle;
    }

    .web-icon-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #232733;
      border: 1px solid var(--border);
      color: var(--accent);
      text-decoration: none;
      transition: all 0.15s ease;
      margin: 0 auto;
    }

    .web-icon-link:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .web-icon-link svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
    }

    .pill {
      display: inline-block;
      background: #232733;
      border: 1px solid #333849;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    /* Footer Pagination */
    footer {
      padding: 0.65rem 1.5rem;
      background: #161922;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      font-size: 0.85rem;
    }

    .pagination-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .page-btn {
      background: #232733;
      color: #fff;
      border: 1px solid var(--border);
      padding: 0.35rem 0.8rem;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-btn:hover:not(:disabled) {
      background: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">Bizgrid</div>
    <div class="controls">
      <input type="text" id="search-input" class="search-bar" placeholder="Search companies, countries, industries..." />
      <span class="record-count" id="record-count">0 records</span>
    </div>
  </header>

  <main>
    <div id="loading-state">
      <div class="spinner"></div>
      <p>Loading records from Dataset...</p>
    </div>

    <div class="table-container" id="table-container">
      <table>
        <thead>
          <tr>
            <th class="col-logo">Logo</th>
            <th class="col-name">Company Name</th>
            <th class="col-country">Country</th>
            <th class="col-desc">Description</th>
            <th class="col-web">Website</th>
            <th class="col-emp sortable" onclick="toggleSort('Number of employees')">
              Employees <span class="sort-icon" id="sort-emp">↕</span>
            </th>
            <th class="col-year sortable" onclick="toggleSort('Founded year')">
              Founded <span class="sort-icon" id="sort-year">↕</span>
            </th>
            <th class="col-rev sortable" onclick="toggleSort('Revenue range')">
              Revenue <span class="sort-icon" id="sort-rev">↕</span>
            </th>
            <th class="col-misc">Activity</th>
            <th class="col-misc">Sub-industry</th>
            <th class="col-misc">Industry</th>
            <th class="col-misc">Sector</th>
            <th class="col-misc">Region</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </main>

  <footer id="table-footer" style="display: none;">
    <span id="page-info" style="color: var(--text-muted);">Page 1 of 1</span>
    <div class="pagination-actions">
      <button class="page-btn" id="prev-btn" onclick="goToPage(currentPage - 1)">Previous</button>
      <button class="page-btn" id="next-btn" onclick="goToPage(currentPage + 1)">Next</button>
    </div>
  </footer>

  <script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1R8aekz9Tx803PiGKX9AjB_z8qUD19_JU/gviz/tq?tqx=out:json&sheet=Dataset&gid=1224566365';
    const ROWS_PER_PAGE = 100;

    // Custom Rank Mappings
    const EMPLOYEE_RANKS = {
      '1-10': 1,
      '11-50': 2,
      '51-100': 3,
      '101-250': 4,
      '251-500': 5,
      '501-1000': 6,
      '1001-5000': 7,
      '5001-10000': 8,
      '10001+': 9
    };

    const REVENUE_RANKS = {
      'less than $1m': 1,
      '$1m to $10m': 2,
      '$10m to $50m': 3,
      '$50m to $100m': 4,
      '$100m to $500m': 5,
      '$500m to $1b': 6,
      '$1b to $10b': 7,
      '$10b to $50b': 8,
      '$50b+': 9
    };

    let allCompanies = [];
    let filteredCompanies = [];
    let currentPage = 1;
    let currentSortColumn = null;
    let currentSortOrder = 'none'; // 'asc', 'desc', or 'none'

    async function fetchDataset() {
      try {
        const response = await fetch(SHEET_URL);
        const text = await response.text();

        const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const json = JSON.parse(jsonString);

        const headers = json.table.cols.map(c => (c.label ? c.label.trim() : ''));

        return json.table.rows.map(row => {
          const entry = {};
          row.c.forEach((cell, idx) => {
            const key = headers[idx];
            if (key && key !== 'Coordinates') {
              entry[key] = (cell && cell.v !== null && cell.v !== undefined) ? cell.v : '';
            }
          });
          return entry;
        });
      } catch (err) {
        console.error('Failed to load Google Sheet data:', err);
        return [];
      }
    }

    function getRank(column, value) {
      if (!value) return -1;
      const cleanVal = value.toString().trim().toLowerCase();

      if (column === 'Number of employees') {
        return EMPLOYEE_RANKS[cleanVal] || 0;
      }

      if (column === 'Revenue range') {
        return REVENUE_RANKS[cleanVal] || 0;
      }

      if (column === 'Founded year') {
        const yr = parseInt(cleanVal, 10);
        return isNaN(yr) ? 0 : yr;
      }

      return cleanVal;
    }

    function toggleSort(column) {
      if (currentSortColumn === column) {
        if (currentSortOrder === 'asc') currentSortOrder = 'desc';
        else if (currentSortOrder === 'desc') {
          currentSortOrder = 'none';
          currentSortColumn = null;
        }
      } else {
        currentSortColumn = column;
        currentSortOrder = 'asc';
      }

      updateSortHeaders();
      applyFiltersAndSort();
    }

    function updateSortHeaders() {
      const empIcon = document.getElementById('sort-emp');
      const yearIcon = document.getElementById('sort-year');
      const revIcon = document.getElementById('sort-rev');

      empIcon.textContent = '↕';
      yearIcon.textContent = '↕';
      revIcon.textContent = '↕';

      empIcon.parentElement.classList.remove('sort-active');
      yearIcon.parentElement.classList.remove('sort-active');
      revIcon.parentElement.classList.remove('sort-active');

      if (currentSortOrder === 'none' || !currentSortColumn) return;

      const symbol = currentSortOrder === 'asc' ? '▲' : '▼';

      if (currentSortColumn === 'Number of employees') {
        empIcon.textContent = symbol;
        empIcon.parentElement.classList.add('sort-active');
      } else if (currentSortColumn === 'Founded year') {
        yearIcon.textContent = symbol;
        yearIcon.parentElement.classList.add('sort-active');
      } else if (currentSortColumn === 'Revenue range') {
        revIcon.textContent = symbol;
        revIcon.parentElement.classList.add('sort-active');
      }
    }

    function applyFiltersAndSort() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      currentPage = 1;

      // 1. Search Filter
      let results = !query
        ? [...allCompanies]
        : allCompanies.filter(item => {
            return (
              (item['Company Name'] || '').toString().toLowerCase().includes(query) ||
              (item['Country'] || '').toString().toLowerCase().includes(query) ||
              (item['Description'] || '').toString().toLowerCase().includes(query) ||
              (item['Industry'] || '').toString().toLowerCase().includes(query) ||
              (item['Sector'] || '').toString().toLowerCase().includes(query) ||
              (item['Sub-industry'] || '').toString().toLowerCase().includes(query) ||
              (item['Activity'] || '').toString().toLowerCase().includes(query) ||
              (item['Region'] || '').toString().toLowerCase().includes(query)
            );
          });

      // 2. Custom Sort
      if (currentSortColumn && currentSortOrder !== 'none') {
        results.sort((a, b) => {
          const rankA = getRank(currentSortColumn, a[currentSortColumn]);
          const rankB = getRank(currentSortColumn, b[currentSortColumn]);

          if (rankA === rankB) return 0;
          if (rankA === -1 || rankA === 0) return 1;
          if (rankB === -1 || rankB === 0) return -1;

          if (currentSortOrder === 'asc') {
            return rankA > rankB ? 1 : -1;
          } else {
            return rankA < rankB ? 1 : -1;
          }
        });
      }

      filteredCompanies = results;
      renderCurrentPage();
    }

    function renderCurrentPage() {
      const tbody = document.getElementById('table-body');
      const tableContainer = document.getElementById('table-container');
      const countLabel = document.getElementById('record-count');
      const pageInfo = document.getElementById('page-info');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');

      tbody.innerHTML = '';
      countLabel.textContent = `${filteredCompanies.length.toLocaleString()} records`;

      const totalPages = Math.ceil(filteredCompanies.length / ROWS_PER_PAGE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages;

      if (filteredCompanies.length === 0) {
        tbody.innerHTML = `<tr><td colspan="13" style="text-align: center; padding: 3rem; color: var(--text-muted);">No matching records found.</td></tr>`;
        return;
      }

      const start = (currentPage - 1) * ROWS_PER_PAGE;
      const end = start + ROWS_PER_PAGE;
      const pageItems = filteredCompanies.slice(start, end);

      const fragment = document.createDocumentFragment();

      pageItems.forEach(item => {
        const tr = document.createElement('tr');

        const logo = item['Logo'] || '';
        const name = item['Company Name'] || '-';
        const country = item['Country'] || '-';
        const desc = item['Description'] || '-';
        const website = item['Website'] || '';
        const employees = item['Number of employees'] || '-';
        const founded = item['Founded year'] || '-';
        const revenue = item['Revenue range'] || '-';
        const activity = item['Activity'] || '-';
        const subIndustry = item['Sub-industry'] || '-';
        const industry = item['Industry'] || '-';
        const sector = item['Sector'] || '-';
        const region = item['Region'] || '-';

        const logoHtml = logo
          ? `<img src="${logo}" class="table-logo" alt="${name}" onerror="this.onerror=null; this.outerHTML='<span class=\\'logo-fallback\\'>${name[0] || 'C'}</span>'" />`
          : `<span class="logo-fallback">${name[0] || 'C'}</span>`;

        let websiteHtml = '<span style="color: var(--text-muted);">-</span>';
        if (website && website !== '-') {
          const websiteUrl = website.startsWith('http') ? website : 'https://' + website;
          websiteHtml = `
            <a href="${websiteUrl}" target="_blank" rel="noopener noreferrer" class="web-icon-link" title="${website}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
            </a>
          `;
        }

        tr.innerHTML = `
          <td class="col-logo">${logoHtml}</td>
          <td class="col-name" title="${name}"><strong>${name}</strong></td>
          <td class="col-country">${country !== '-' ? `<span class="pill">${country}</span>` : '-'}</td>
          <td class="col-desc">${desc}</td>
          <td class="col-web">${websiteHtml}</td>
          <td class="col-emp">${employees}</td>
          <td class="col-year">${founded}</td>
          <td class="col-rev">${revenue}</td>
          <td class="col-misc">${activity}</td>
          <td class="col-misc">${subIndustry}</td>
          <td class="col-misc">${industry}</td>
          <td class="col-misc">${sector}</td>
          <td class="col-misc">${region}</td>
        `;

        fragment.appendChild(tr);
      });

      tbody.appendChild(fragment);
      tableContainer.scrollTop = 0;
    }

    function goToPage(page) {
      currentPage = page;
      renderCurrentPage();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('search-input').addEventListener('input', applyFiltersAndSort);

      allCompanies = await fetchDataset();
      filteredCompanies = allCompanies;

      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('table-container').style.display = 'block';
      document.getElementById('table-footer').style.display = 'flex';

      renderCurrentPage();
    });
  </script>
</body>
</html>
